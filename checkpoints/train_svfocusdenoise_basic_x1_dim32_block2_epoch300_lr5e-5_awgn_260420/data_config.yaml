clean_prob: 0.2
crop_size: 256
dataset_type: denoise
degradation:
  stage1:
    gaussian_noise:
      enabled: true
      prob: 0.5
      sigma_max: 6
      sigma_min: 1
    jpeg:
      enabled: true
      prob: 0.15
      quality_max: 98
      quality_min: 88
    poisson_noise:
      enabled: true
      prob: 0.4
      scale_max: 2.0
      scale_min: 0.05
    unprocess_noise:
      enabled: true
      prob: 0.7
      read_noise_max: 0.01
      shot_noise_max: 6.0
  stage2:
    blur:
      enabled: false
    chroma_noise:
      enabled: false
    common_noise:
      enabled: true
      prob: 0.3
      sigma_max: 8
      sigma_min: 1
    final_jpeg:
      enabled: true
      prob: 0.1
      quality_max: 98
      quality_min: 90
    hot_pixels:
      enabled: false
    ir_noise:
      enabled: false
    target_resize:
      enabled: false
use_flip: true
use_rot: true
