export_onnx: false
loss:
  charbonnier:
    enabled: true
    weight: 1.0
  color_consistency:
    enabled: true
    loss_type: charbonnier
    weight: 0.08
  edge:
    enabled: true
    mode: gray
    weight: 0.12
  hot_pixel_masked:
    base_loss: charbonnier
    enabled: true
    kernel_size: 3
    threshold: 0.08
    weight: 0.18
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: false
    weight: 0.0
  ssim:
    enabled: true
    weight: 0.15
  tv:
    enabled: false
    weight: 0.0
model:
  dim: 32
  n_resblocks: 2
  name: svfocussrnet
  scale: 1
  use_advanced_rep: false
task: denoise
train:
  batch_size: 96
  early_stopping:
    min_delta: 0.0
    mode: max
    monitor: psnr
    patience: 40
  epochs: 180
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  lr: 1e-5
  num_workers: 4
  optimizer:
    betas:
    - 0.9
    - 0.999
    type: AdamW
  patch_size: 256
  pretrained_path: checkpoints/train_svfocusdenoise_basic_x1_dim32_block2_epoch300_lr5e-5_awgn_260420/best.pth
  save_interval: 20
  save_name: finetune_svfocusdenoise_mc_g105_v2_x1_dim32_block2_260424
  scheduler:
    T_max: 180
    eta_min: 1e-7
    type: CosineAnnealingLR
  weight_decay: 1e-4
