data:
  train_root: /mnt/data_server/etc/jshong/SuperResolution/Finetunning_Dataset/train/
  type: ir
  val_hr_root: /mnt/data_server/etc/jshong/SuperResolution/Finetunning_Dataset/val/HR
  val_lr_root: /mnt/data_server/etc/jshong/SuperResolution/Finetunning_Dataset/val/LRx4
data_config:
  clean_prob: 0.05
  crop_size: 256
  dataset_type: sr
  degradation:
    stage1:
      blur:
        betag:
        - 0.5
        - 4.0
        betap:
        - 1.0
        - 2.0
        enabled: true
        kernel_probs:
        - 0.45
        - 0.25
        - 0.12
        - 0.03
        - 0.12
        - 0.03
        kernel_sizes:
        - 7
        - 9
        - 11
        - 13
        - 15
        - 17
        - 19
        - 21
        prob: 0.35
        sigma:
        - 0.2
        - 1.5
      gaussian_noise:
        enabled: true
        gray_prob: 1.0
        prob: 0.2
        sigma_max: 5
        sigma_min: 1
      jpeg:
        enabled: true
        prob: 0.1
        quality_max: 95
        quality_min: 85
      poisson_noise:
        enabled: true
        gray_prob: 1.0
        prob: 0.3
        scale_max: 3.0
        scale_min: 0.05
      resize:
        enabled: true
        interpolations:
        - cv2.INTER_LINEAR
        - cv2.INTER_CUBIC
        - cv2.INTER_AREA
        prob: 0.7
        scale_max: 1.0
        scale_min: 0.5
      sinc:
        enabled: true
        kernel_sizes:
        - 7
        - 9
        - 11
        - 13
        - 15
        - 17
        - 19
        - 21
        prob: 0.1
    stage2:
      blur:
        betag:
        - 0.5
        - 4.0
        betap:
        - 1.0
        - 2.0
        enabled: true
        kernel_probs:
        - 0.45
        - 0.25
        - 0.12
        - 0.03
        - 0.12
        - 0.03
        kernel_sizes:
        - 7
        - 9
        - 11
        - 13
        - 15
        - 17
        - 19
        - 21
        prob: 0.5
        sigma:
        - 0.2
        - 1.5
      common_noise:
        enabled: false
        prob: 0.0
      final_jpeg:
        enabled: true
        prob: 0.1
        quality_max: 92
        quality_min: 80
      hot_pixels:
        blob_prob: 0.35
        blob_radius_max: 4
        blob_radius_min: 1
        density_max: 0.0035
        density_min: 0.0005
        enabled: true
        prob: 0.6
      ir_noise:
        enabled: true
        non_uniformity:
          amp_max: 0.25
          amp_min: 0.08
          prob: 0.5
        thermal_noise:
          gray_prob: 1.0
          sigma_max: 16
          sigma_min: 4
        vertical_line:
          intensity_max: 8
          intensity_min: 2
          prob: 0.45
      target_resize:
        enabled: true
        interpolations:
        - cv2.INTER_CUBIC
        - cv2.INTER_LINEAR
        - cv2.INTER_LANCZOS4
  use_flip: true
  use_rot: true
data_config_path: configs/data/sr_finetune_ir_sensor.yaml
export_onnx: false
loss:
  charbonnier:
    enabled: true
    weight: 1.0
  edge:
    enabled: true
    mode: gray
    weight: 0.05
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: false
    weight: 0.01
  ssim:
    enabled: true
    weight: 0.1
  tv:
    enabled: true
    weight: 0.01
model:
  dim: 32
  n_resblocks: 4
  name: svfocussrnet
  scale: 4
  use_advanced_rep: false
task: sr
train:
  batch_size: 32
  early_stopping:
    min_delta: 0.0001
    mode: min
    monitor: loss
    patience: 10
  epochs: 100
  grad_clip: 1.0
  gradient_accumulation_steps: 2
  lr: 1e-5
  num_workers: 4
  optimizer:
    betas:
    - 0.9
    - 0.999
    type: AdamW
  patch_size: 256
  pretrained_path: checkpoints/train_svfocussrnet_sr_x4_dim32_block4_epoch300_bs64_lr1e-4_charbonnier_260428/best.pth
  save_interval: 20
  save_name: finetune_svfocussrnet_ir_sr_x4_dim32_block4_epoch100_bs32_ga2_lr1e-5_charbonnier_edge_ssim_tv_260507
  scheduler:
    T_max: 100
    eta_min: 1e-7
    type: CosineAnnealingLR
  weight_decay: 0.0
