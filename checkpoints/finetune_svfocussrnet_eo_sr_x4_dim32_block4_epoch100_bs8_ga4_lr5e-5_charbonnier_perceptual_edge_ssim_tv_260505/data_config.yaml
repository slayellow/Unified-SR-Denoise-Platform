clean_prob: 0.1
crop_size: 256
dataset_type: sr
degradation:
  stage1:
    blur:
      betag:
      - 0.8
      - 3.0
      betap:
      - 1.0
      - 1.6
      enabled: true
      kernel_probs:
      - 0.5
      - 0.22
      - 0.1
      - 0.03
      - 0.12
      - 0.03
      kernel_sizes:
      - 7
      - 9
      - 11
      - 13
      - 15
      prob: 0.35
      sigma:
      - 0.2
      - 1.6
    gaussian_noise:
      enabled: true
      gray_prob: 0.5
      prob: 0.1
      sigma_max: 3
      sigma_min: 1
    jpeg:
      enabled: true
      prob: 0.2
      quality_max: 98
      quality_min: 90
    poisson_noise:
      enabled: true
      gray_prob: 0.5
      prob: 0.1
      scale_max: 1.0
      scale_min: 0.05
    resize:
      enabled: true
      interpolations:
      - cv2.INTER_LINEAR
      - cv2.INTER_CUBIC
      - cv2.INTER_AREA
      prob: 0.7
      scale_max: 1.0
      scale_min: 0.5
    sinc:
      enabled: true
      kernel_sizes:
      - 7
      - 9
      - 11
      - 13
      - 15
      - 17
      - 19
      - 21
      prob: 0.25
  stage2:
    blur:
      betag:
      - 0.8
      - 3.0
      betap:
      - 1.0
      - 1.6
      enabled: true
      kernel_probs:
      - 0.5
      - 0.22
      - 0.1
      - 0.03
      - 0.12
      - 0.03
      kernel_sizes:
      - 7
      - 9
      - 11
      - 13
      - 15
      prob: 0.25
      sigma:
      - 0.2
      - 1.0
    chroma_noise:
      downscale: 4
      enabled: true
      prob: 0.1
      sigma_max: 6
      sigma_min: 2
    common_noise:
      enabled: true
      gray_prob: 0.3
      prob: 0.05
      sigma_max: 3
      sigma_min: 1
    final_jpeg:
      enabled: true
      prob: 0.2
      quality_max: 98
      quality_min: 85
    hot_pixels:
      enabled: false
      prob: 0.0
    ir_noise:
      enabled: false
    target_resize:
      enabled: true
      interpolations:
      - cv2.INTER_CUBIC
      - cv2.INTER_LINEAR
      - cv2.INTER_LANCZOS4
use_flip: true
use_rot: true
