task: denoise
data_config_path: configs/data/denoise_mc_g105_phase1_deploy_hybrid_v3.yaml

model:
  name: nafnet_denoise_teacher
  scale: 1
  dim: 64
  img_channel: 3
  middle_blk_num: 12
  enc_blk_nums: [2, 2, 4, 8]
  dec_blk_nums: [2, 2, 2, 2]
  dw_expand: 2
  ffn_expand: 2
  drop_out_rate: 0.0
  clamp_output: false

data:
  type: eo
  train_root:
    - /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/train/
  # Temporary guardrail validation set until a fixed v3 validation input set is generated.
  val_hr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/mc_g105_phase1_denoise_priority_v2_fixed/HR
  val_lr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/mc_g105_phase1_denoise_priority_v2_fixed/LR

train:
  epochs: 320
  batch_size: 8
  lr: 1e-4
  num_workers: 4
  gradient_accumulation_steps: 4
  patch_size: 256
  save_interval: 20
  save_name: "train_nafnet_teacher_mc_g105_phase1_deploy_hybrid_v3_x1_width64_260519"

  pretrained_path: null

  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
  weight_decay: 1e-4
  grad_clip: 1.0

  early_stopping:
    patience: 70
    min_delta: 0.00001
    monitor: 'loss'
    mode: 'min'

  scheduler:
    type: CosineAnnealingLR
    T_max: 320
    eta_min: 1e-7

loss:
  charbonnier:
    enabled: true
    weight: 1.0
  edge:
    enabled: true
    weight: 0.10
    mode: 'gray'
    threshold: 0.08
  ssim:
    enabled: true
    weight: 0.08
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: false
    weight: 0.0
  color_consistency:
    enabled: true
    weight: 0.06
    loss_type: 'charbonnier'
  hot_pixel_masked:
    enabled: true
    weight: 0.16
    threshold: 0.10
    base_loss: 'charbonnier'
    kernel_size: 3
  tv:
    enabled: false
    weight: 0.0

export_onnx: false
