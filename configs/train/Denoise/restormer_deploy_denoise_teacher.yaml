task: denoise
data_config_path: configs/data/denoise_mc_g105_val.yaml

model:
  name: restormer_denoise_teacher
  scale: 1
  dim: 48
  inp_channels: 3
  out_channels: 3
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  layer_norm_type: BiasFree
  dual_pixel_task: false
  clamp_output: false

data:
  type: eo
  train_root:
    - /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/tmp/
  val_hr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/HR
  val_lr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/LR

train:
  epochs: 300
  batch_size: 4
  lr: 5e-5
  num_workers: 4
  gradient_accumulation_steps: 16
  patch_size: 256
  save_interval: 20
  save_name: "train_restormer_teacher_mc_g105_denoise_x1_dim48_1gpu_260527"

  pretrained_path: null

  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
  weight_decay: 1e-4
  grad_clip: 1.0

  early_stopping:
    patience: 50
    min_delta: 0.0001
    monitor: 'lpips'
    mode: 'min'

  scheduler:
    type: CosineAnnealingLR
    T_max: 300
    eta_min: 1e-7

loss:
  charbonnier:
    enabled: true
    weight: 1.0
  edge:
    enabled: true
    weight: 0.15
    mode: 'gray'
  ssim:
    enabled: true
    weight: 0.5
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: true
    weight: 0.05
  tv:
    enabled: false
    weight: 0.1

export_onnx: false
