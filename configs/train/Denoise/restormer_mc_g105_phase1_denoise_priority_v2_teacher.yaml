task: denoise
model:
  name: restormer_denoise_teacher
  scale: 1
  dim: 48
  inp_channels: 3
  out_channels: 3
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  layer_norm_type: BiasFree
  dual_pixel_task: false
  clamp_output: false

data:
  type: eo
  train_root:
    - /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/train/
  val_hr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/mc_g105_phase1_denoise_priority_v2_fixed/HR
  val_lr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/mc_g105_phase1_denoise_priority_v2_fixed/LR

train:
  epochs: 320
  batch_size: 4
  lr: 1e-4
  num_workers: 4
  gradient_accumulation_steps: 8
  patch_size: 256
  save_interval: 20
  save_name: "train_restormer_teacher_mc_g105_phase1_denoise_priority_v2_x1_dim48_260516"

  pretrained_path: null

  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
  weight_decay: 1e-4
  grad_clip: 1.0

  early_stopping:
    patience: 70
    min_delta: 0.00001
    monitor: 'loss'
    mode: 'min'

  scheduler:
    type: CosineAnnealingLR
    T_max: 320
    eta_min: 1e-7

loss:
  charbonnier:
    enabled: true
    weight: 1.0
  edge:
    enabled: true
    weight: 0.08
    mode: 'gray'
  ssim:
    enabled: true
    weight: 0.08
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: false
    weight: 0.0
  color_consistency:
    enabled: true
    weight: 0.08
    loss_type: 'charbonnier'
  hot_pixel_masked:
    enabled: true
    weight: 0.18
    threshold: 0.08
    base_loss: 'charbonnier'
    kernel_size: 3
  tv:
    enabled: false
    weight: 0.0

export_onnx: false
