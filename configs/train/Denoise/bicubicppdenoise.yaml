task: denoise
data_config_path: configs/data/bicubicpp/denoise.yaml

model:
  name: bicubicplusplus
  scale: 1
  dim: 32
  upsample_mode: legacy
  n_body: 4
  act: leaky_relu
  use_rep: true
  clamp_output: true

data:
  type: eo
  train_root:
    - /mnt/data2/jshong/SuperResolution/Pretrained_Dataset/train/
  val_hr_root: /mnt/data2/jshong/SuperResolution/Pretrained_Dataset/val_denoise/HR
  val_lr_root: /mnt/data2/jshong/SuperResolution/Pretrained_Dataset/val_denoise_cam_a9nr5/LR

train:
  epochs: 300
  batch_size: 128
  lr: 1e-4
  num_workers: 12
  gradient_accumulation_steps: 1
  patch_size: 256
  save_interval: 10
  save_name: train_bicubicppdenoise_eo_x1_dim32_half4_ep300_bs128_lr1e-4_v1
  pretrained_path: null

  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
  weight_decay: 1e-4
  grad_clip: 1.0

  ema:
    enabled: true
    decay: 0.999
    start_epoch: 2

  early_stopping:
    patience: 50
    min_delta: 0.0001
    monitor: 'lpips'
    mode: 'min'

  scheduler:
    type: CosineAnnealingLR
    T_max: 300
    eta_min: 1e-7

loss:
  charbonnier:
    enabled: true
    weight: 1.0
  edge:
    enabled: true
    weight: 0.05
    mode: 'gray'
  ssim:
    enabled: true
    weight: 0.1
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: false
    weight: 0.05
  tv:
    enabled: false
    weight: 0.1
