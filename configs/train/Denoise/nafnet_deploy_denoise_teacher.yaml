task: denoise
data_config_path: configs/data/denoise.yaml

model:
  name: nafnet_denoise_teacher
  scale: 1
  dim: 64
  img_channel: 3
  middle_blk_num: 12
  enc_blk_nums: [2, 2, 4, 8]
  dec_blk_nums: [2, 2, 2, 2]
  dw_expand: 2
  ffn_expand: 2
  drop_out_rate: 0.0
  clamp_output: false

data:
  type: eo
  train_root:
    - /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/tmp/
  val_hr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/HR
  val_lr_root: /mnt/data_server/etc/jshong/SuperResolution/Pretrained_Dataset/val_denoise/LR

train:
  epochs: 300
  batch_size: 8
  lr: 5e-5
  num_workers: 4
  gradient_accumulation_steps: 4
  patch_size: 256
  save_interval: 20
  save_name: "train_nafnet_teacher_deploy_denoise_x1_width64_260519"

  pretrained_path: null

  optimizer:
    type: AdamW
    betas: [0.9, 0.999]
  weight_decay: 1e-4
  grad_clip: 1.0

  early_stopping:
    patience: 50
    min_delta: 0.0001
    monitor: 'lpips'
    mode: 'min'

  scheduler:
    type: CosineAnnealingLR
    T_max: 300
    eta_min: 1e-7

loss:
  charbonnier:
    enabled: true
    weight: 1.0
  edge:
    enabled: true
    weight: 0.15
    mode: 'gray'
  ssim:
    enabled: true
    weight: 0.5
  l1:
    enabled: false
    weight: 1.0
  perceptual:
    enabled: true
    weight: 0.05
  tv:
    enabled: false
    weight: 0.1

export_onnx: false
