dataset_type: sr
clean_prob: 0.3

crop_size: 256
use_flip: true
use_rot: true

degradation:
  stage1:
    blur:
      enabled: true
      prob: 0.08
      kernel_probs: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
      kernel_sizes: [7, 9, 11, 13, 15, 17, 19, 21]
      sigma: [0.2, 0.8]
      betag: [0.5, 4.0]
      betap: [1.0, 2.0]
    resize:
      enabled: false
      prob: 0.0
      scale_min: 1.0
      scale_max: 1.0
      interpolations: ["cv2.INTER_CUBIC"]
    gaussian_noise:
      enabled: true
      prob: 0.10
      sigma_min: 1
      sigma_max: 2
      gray_prob: 0.5
    poisson_noise:
      enabled: true
      prob: 0.10
      scale_min: 0.05
      scale_max: 0.3
      gray_prob: 0.5
    jpeg:
      enabled: true
      prob: 0.12
      quality_min: 95
      quality_max: 100
    sinc:
      enabled: false
      prob: 0.0
      kernel_sizes: [7, 9, 11, 13, 15, 17, 19, 21]

  stage2:
    blur:
      enabled: true
      prob: 0.05
      kernel_probs: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
      kernel_sizes: [7, 9, 11, 13, 15, 17, 19, 21]
      sigma: [0.2, 0.6]
      betag: [0.5, 4.0]
      betap: [1.0, 2.0]

    target_resize:
      enabled: true
      interpolations: ["cv2.INTER_AREA", "cv2.INTER_AREA", "cv2.INTER_CUBIC",
                       "cv2.INTER_LINEAR", "cv2.INTER_LANCZOS4"]

    common_noise:
      enabled: true
      prob: 0.05
      sigma_min: 1
      sigma_max: 2
      gray_prob: 0.2

    ir_noise:
      enabled: false
      non_uniformity:
        enabled: false
        prob: 0.0
        amp_min: 0.0
        amp_max: 0.0
      thermal_noise:
        enabled: false
        sigma_min: 0
        sigma_max: 0
        gray_prob: 0.0
      vertical_line:
        enabled: false
        prob: 0.0
        intensity_min: 0
        intensity_max: 0

    final_jpeg:
      enabled: true
      prob: 0.08
      quality_min: 95
      quality_max: 100

    hot_pixels:
      enabled: true
      prob: 0.2
      density_min: 0.0005
      density_max: 0.002
      blob_prob: 0.0
      blob_radius_min: 1
      blob_radius_max: 1
