dataset_type: denoise
clean_prob: 0.0
crop_size: 256
use_flip: false
use_rot: false

degradation:
  stage1:
    unprocess_noise:
      enabled: true
      prob: 0.35
      read_noise_max: 0.018
      shot_noise_max: 8.0
    blur:
      enabled: true
      prob: 0.25
      kernel_probs: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
      kernel_sizes: [7, 9, 11, 13]
      sigma: [0.2, 1.2]
      betag: [0.5, 4.0]
      betap: [1.0, 2.0]
    resize:
      enabled: false
    gaussian_noise:
      enabled: true
      prob: 0.8
      sigma_min: 2
      sigma_max: 8
      gray_prob: 0.2
    poisson_noise:
      enabled: true
      prob: 0.7
      scale_min: 0.2
      scale_max: 4.0
      gray_prob: 0.2
    jpeg:
      enabled: true
      prob: 0.4
      quality_min: 75
      quality_max: 95
    sinc:
      enabled: false

  stage2:
    blur:
      enabled: true
      prob: 0.2
      kernel_sizes: [7, 9, 11]
      sigma: [0.2, 0.8]
    target_resize:
      enabled: true
    common_noise:
      enabled: true
      prob: 1.0
      sigma_min: 5
      sigma_max: 18
      gray_prob: 0.15
    chroma_noise:
      enabled: true
      prob: 0.7
      sigma_min: 4
      sigma_max: 15
      downscale: 3
    chroma_mottle:
      enabled: true
      prob: 0.6
      sigma_min: 2
      sigma_max: 7
      downscale: 8
    row_noise:
      enabled: true
      prob: 0.6
      sigma_min: 1
      sigma_max: 7
      channel_independent_prob: 0.35
    periodic_grid_noise:
      enabled: true
      prob: 0.7
      amplitude_min: 0.7
      amplitude_max: 3.0
      period_min: 2.0
      period_max: 7.0
      channel_jitter: 0.35
    eo_shading:
      enabled: true
      prob: 0.35
      strength: [0.03, 0.10]
      sigma: [0.65, 1.25]
      center_offset: [-0.12, 0.12]
      diagonal_prob: 0.25
      chroma_strength: [0.0, 0.012]
    signal_instability:
      enabled: true
      prob: 0.3
      gain: [0.96, 1.05]
      gamma: [0.96, 1.04]
      channel_gain: [0.97, 1.03]
    color_cast:
      enabled: true
      prob: 0.25
      rg_shift: [-5.0, 2.0]
      bg_shift: [-5.0, 2.0]
      global_gain: [0.98, 1.02]
    highlight_clipping:
      enabled: true
      prob: 0.25
      gain: [1.02, 1.08]
      gamma: [0.96, 1.02]
      channel_gain: [0.98, 1.03]
    hot_pixels:
      enabled: true
      prob: 0.45
      density_min: 0.0004
      density_max: 0.0015
      blob_prob: 0.1
      blob_radius_min: 1
      blob_radius_max: 2
    final_jpeg:
      enabled: true
      prob: 0.8
      quality_min: 45
      quality_max: 85
