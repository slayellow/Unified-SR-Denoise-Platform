dataset_type: denoise
clean_prob: 0.05

crop_size: 256
use_flip: true
use_rot: true

# MC-G105 Denoise Pipeline v1 - Phase 2 Field
# 근거:
# - results/mc_g105_analysis/all
# - road_shaded: dominant hard case
# - afternoon mixed: green/chroma/clipping stress
# - 7x: green cast보다 shading/detail/luma instability 중심
# - dark hot-pixel: fixed mask 금지, sparse random density만 사용
# - denoise-priority: visible luma noise / hot pixel / chroma mottle 우선 완화
conditional_profiles:
  enabled: true
  axes: [profile]
  sampling:
    profile:
      generic_replay: 0.20
      normal_building: 0.06
