dataset_type: denoise
clean_prob: 0.02

crop_size: 256
use_flip: true
use_rot: true

# MC-G105 Denoise Pipeline v2 - Phase 1 Denoise Priority
# 목적:
# - Public HR을 clean target으로 유지
# - blur/detail collapse보다 2D/3D NR성 자글거림, hot pixel, chroma noise 제거를 우선 학습
# - 표지판 글자/전선/기둥 edge가 deploy처럼 과하게 뭉개지지 않도록 blur 계열은 최소화
degradation:
  stage1:
    unprocess_noise:
      enabled: true
      prob: 0.75
      read_noise_max: 0.018
      shot_noise_max: 10.0

    turbulence:
      enabled: false
      prob: 0.0

    blur:
      enabled: true
      prob: 0.02
      kernel_probs: [0.80, 0.10, 0.04, 0.01, 0.04, 0.01]
      kernel_sizes: [7, 9]
      sigma: [0.15, 0.35]
      betag: [0.8, 1.8]
      betap: [1.0, 1.3]

    resize:
      enabled: false
      prob: 0.0
      scale_min: 1.0
      scale_max: 1.0
      interpolations: ["cv2.INTER_LINEAR"]

    gaussian_noise:
      enabled: true
      prob: 0.45
      sigma_min: 2
      sigma_max: 7
      gray_prob: 0.35

    poisson_noise:
      enabled: true
      prob: 0.40
      scale_min: 0.10
      scale_max: 2.5
      gray_prob: 0.25

    jpeg:
      enabled: true
      prob: 0.02
      quality_min: 96
      quality_max: 99

    sinc:
      enabled: false
      prob: 0.0
      kernel_sizes: [7, 9]

  stage2:
    blur:
      enabled: false
      prob: 0.0
      kernel_probs: [0.80, 0.10, 0.04, 0.01, 0.04, 0.01]
      kernel_sizes: [7, 9]
      sigma: [0.15, 0.35]
      betag: [0.8, 1.8]
      betap: [1.0, 1.3]

    target_resize:
      enabled: false
      interpolations: ["cv2.INTER_CUBIC", "cv2.INTER_LINEAR"]

    ir_noise:
      enabled: false

    eo_shading:
      enabled: true
      prob: 0.08
      strength: [0.02, 0.06]
      sigma: [0.75, 1.30]
      center_offset: [-0.08, 0.08]
      diagonal_prob: 0.15
      chroma_strength: [0.0, 0.006]

    detail_attenuation:
      enabled: true
      prob: 0.03
      blur_sigma: [0.12, 0.30]
      detail_blend: [0.03, 0.08]
      contrast: [0.96, 1.00]

    signal_instability:
      enabled: true
      prob: 0.12
      gain: [0.97, 1.04]
      gamma: [0.97, 1.04]
      channel_gain: [0.98, 1.03]

    color_cast:
      enabled: true
      prob: 0.20
      rg_shift: [-4.5, -0.5]
      bg_shift: [-3.5, 0.8]
      global_gain: [0.99, 1.02]

    highlight_clipping:
      enabled: true
      prob: 0.04
      gain: [1.02, 1.06]
      gamma: [0.97, 1.02]
      channel_gain: [0.99, 1.02]

    common_noise:
      enabled: true
      prob: 0.55
      sigma_min: 2
      sigma_max: 8
      gray_prob: 0.35

    chroma_noise:
      enabled: false

    chroma_mottle:
      enabled: true
      prob: 0.45
      sigma_min: 3.0
      sigma_max: 10.0
      downscale: 8

    hot_pixels:
      enabled: true
      prob: 0.25
      density_min: 0.00008
      density_max: 0.00050
      blob_prob: 0.08
      blob_radius_min: 1
      blob_radius_max: 2

    final_jpeg:
      enabled: true
      prob: 0.02
      quality_min: 96
      quality_max: 99
