dataset_type: denoise
clean_prob: 0.15

crop_size: 256
use_flip: true
use_rot: true

# MC-G105 Denoise Pipeline v3 - Deploy Hybrid
# Purpose:
# - Restore the deploy pipeline's strong real-world degradation backbone.
# - Keep MC-G105-specific color/shading/mottle terms as secondary effects.
# - Avoid training the model to solve only mild synthetic denoise.
degradation:
  stage1:
    unprocess_noise:
      enabled: true
      prob: 0.35
      read_noise_max: 0.018
      shot_noise_max: 10.0

    turbulence:
      enabled: false
      prob: 0.0

    blur:
      enabled: true
      prob: 0.35
      kernel_probs: [0.50, 0.22, 0.10, 0.03, 0.11, 0.04]
      kernel_sizes: [7, 9, 11, 13, 15]
      sigma: [0.18, 1.80]
      betag: [0.6, 3.0]
      betap: [1.0, 1.7]

    resize:
      enabled: true
      prob: 0.45
      scale_min: 0.65
      scale_max: 1.0
      interpolations: ["cv2.INTER_LINEAR", "cv2.INTER_CUBIC", "cv2.INTER_AREA"]

    gaussian_noise:
      enabled: true
      prob: 0.50
      sigma_min: 1
      sigma_max: 7
      gray_prob: 0.45

    poisson_noise:
      enabled: true
      prob: 0.45
      scale_min: 0.05
      scale_max: 3.0
      gray_prob: 0.40

    jpeg:
      enabled: true
      prob: 0.35
      quality_min: 88
      quality_max: 97

    sinc:
      enabled: false
      prob: 0.0
      kernel_sizes: [7, 9, 11, 13, 15]

  stage2:
    blur:
      enabled: true
      prob: 0.25
      kernel_probs: [0.55, 0.22, 0.10, 0.03, 0.08, 0.02]
      kernel_sizes: [7, 9, 11, 13]
      sigma: [0.15, 0.90]
      betag: [0.6, 2.4]
      betap: [1.0, 1.5]

    target_resize:
      enabled: true
      interpolations: ["cv2.INTER_LINEAR", "cv2.INTER_CUBIC"]

    ir_noise:
      enabled: false

    eo_shading:
      enabled: true
      prob: 0.10
      strength: [0.02, 0.08]
      sigma: [0.75, 1.30]
      center_offset: [-0.08, 0.08]
      diagonal_prob: 0.15
      chroma_strength: [0.0, 0.008]

    detail_attenuation:
      enabled: true
      prob: 0.06
      blur_sigma: [0.12, 0.35]
      detail_blend: [0.03, 0.10]
      contrast: [0.95, 1.00]

    signal_instability:
      enabled: true
      prob: 0.12
      gain: [0.97, 1.04]
      gamma: [0.97, 1.04]
      channel_gain: [0.98, 1.03]

    color_cast:
      enabled: true
      prob: 0.18
      rg_shift: [-4.5, -0.5]
      bg_shift: [-3.5, 0.8]
      global_gain: [0.99, 1.02]

    highlight_clipping:
      enabled: true
      prob: 0.08
      gain: [1.02, 1.08]
      gamma: [0.96, 1.02]
      channel_gain: [0.99, 1.03]

    common_noise:
      enabled: true
      prob: 0.55
      sigma_min: 2
      sigma_max: 13
      gray_prob: 0.45

    chroma_noise:
      enabled: false

    chroma_mottle:
      enabled: true
      prob: 0.25
      sigma_min: 2.0
      sigma_max: 7.0
      downscale: 8

    hot_pixels:
      enabled: true
      prob: 0.40
      density_min: 0.00030
      density_max: 0.00150
      blob_prob: 0.10
      blob_radius_min: 1
      blob_radius_max: 2

    final_jpeg:
      enabled: true
      prob: 0.45
      quality_min: 55
      quality_max: 92
